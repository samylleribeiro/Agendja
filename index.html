<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi2-Agendjá</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Título, botão de voltar e de logar em destaque no topo -->
    <header>
        <button class="btn-voltar" id="btn-voltar" onclick="voltar()" style="display: none;">←</button>
        <button class="btn-logar" id="btn-logar" onclick="logar()">Logar</button>
        <h1>Agendjá 🛠️</h1>
    </header>

    <!-- Tela de Boas-Vindas (Inicial) -->
    <div id="tela-boas-vindas">
        <h2>Bem-vindo(a) ao Agendjá!</h2>
        <p>Agende serviços de manutenção de forma rápida e prática.</p>
    </div>

    <!-- Tela de Login -->
    <div id="tela-login" style="display: none;">
        <div id="inputs-login">
            <div>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" maxlength="11" inputmode="numeric" placeholder="Digite seu CPF">
            </div>
            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha">
            </div>
        </div>
        <p id="msg-login"></p>
        <div id="botoes-login">
            <button id="btn-entrar" onclick="entrar()">Entrar</button>
            <button id="btn-cadastrar" onclick="cadastrar()">Cadastrar</button>
            <button id="btn-excluir-conta" onclick="excluirConta()">Excluir Conta</button>
            <button id="btn-redefinir-senha" onclick="redefinirSenha()">Redefinir Senha</button>
        </div>
    </div>
   
    <!-- Tela de Cadastro -->
    <div id="tela-cadastro" style="display: none;">
        <div id="inputs-cadastro">
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
            </div>
            <div>
                <label for="cpf-cadastro">CPF:</label>
                <input type="text" id="cpf-cadastro" maxlength="11" inputmode="numeric" placeholder="Digite seu CPF">
            </div>
            <div>
                <label for="senha-cadastro">Senha:</label>
                <input type="password" id="senha-cadastro" placeholder="Digite sua senha">
            </div>
            <div>
                <label for="confirmar-senha">Confirmar Senha:</label>
                <input type="password" id="confirmar-senha" placeholder="Confirme sua senha">
            </div>
        </div>
        <p id="msg-cadastro"></p>
        <div id="botoes-cadastro">
            <button id="btn-finalizar-cadastro" onclick="finalizarCadastro()">Finalizar Cadastro</button>
        </div>
    </div>
    <!-- Tela de buscar profissional -->
    <div id="tela-buscar-profissional" style="display: none;">
        <h2>Escolha o profissional desejado:</h2>
        <p id="msg-busca"></p>
    <div id="botoes-busca">
        <button id="btn-pedreiro" onclick="selecionarServico('Pedreiro')">Pedreiro 🧱</button>
        <button id="btn-eletricista" onclick="selecionarServico('Eletricista')">Eletricista ⚡</button>
        <button id="btn-encanador" onclick="selecionarServico('Encanador')">Encanador 🚰</button>
        <button id="btn-outroProfissional" onclick="outroProfissional()">Outro Profissional 🛠️</button>  
      </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
